name: Deploy landing

# The image is built here, on GitHub's runner, and only a finished image is sent to the server.
# The box has 1.8GB of RAM and already runs the application stack, so building there would compete
# with live traffic. It also means a failed build never touches production: the running container
# keeps serving and the deploy job simply never starts.

on:
  push:
    branches: [main]
  workflow_dispatch:

# Two deploys racing would leave the box running whichever container finished last, which is not
# necessarily the newer commit.
concurrency:
  group: deploy-landing
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.name }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # GHCR rejects uppercase in image names, and the org is "Coding-The-Brains".
      - id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/meetbrains-landing" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # NEXT_PUBLIC_* values are inlined at build time, so the public URL must be known here.
          build-args: NEXT_PUBLIC_SITE_URL=https://www.meetbrains.ai
          # The commit tag is what makes rollback possible: every deploy is addressable forever.
          tags: |
            ${{ steps.image.outputs.name }}:${{ github.sha }}
            ${{ steps.image.outputs.name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Pull and restart on the server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 10m
          script: |
            set -e
            NEW="${{ needs.build.outputs.image }}:${{ github.sha }}"

            # Remember what is serving now, so a bad release can be undone in the same run.
            PREV=$(sudo docker inspect --format '{{.Config.Image}}' meetbrains-landing 2>/dev/null || echo "")
            echo "current: ${PREV:-none}"
            echo "new:     $NEW"

            sudo docker pull "$NEW"

            start() {
              sudo docker rm -f meetbrains-landing >/dev/null 2>&1 || true
              sudo docker run -d --name meetbrains-landing --restart unless-stopped \
                -p 127.0.0.1:3000:3000 \
                -e MEETBRAINS_API_URL=https://app.meetbrains.ai \
                "$1" >/dev/null
            }

            start "$NEW"

            # The image declares a HEALTHCHECK, so wait for Docker's own verdict rather than
            # guessing with a sleep.
            STATUS=starting
            for _ in $(seq 1 40); do
              STATUS=$(sudo docker inspect --format '{{.State.Health.Status}}' meetbrains-landing 2>/dev/null || echo starting)
              [ "$STATUS" = "healthy" ] && break
              [ "$STATUS" = "unhealthy" ] && break
              sleep 3
            done

            if [ "$STATUS" != "healthy" ]; then
              echo "::error::new image did not become healthy (status: $STATUS)"
              sudo docker logs --tail 50 meetbrains-landing || true
              if [ -n "$PREV" ]; then
                echo "rolling back to $PREV"
                start "$PREV"
              fi
              exit 1
            fi

            # Prove it through nginx, not just inside the container.
            curl -fsS -o /dev/null --retry 3 --retry-delay 2 https://www.meetbrains.ai/

            # The box has a small disk; untagged layers from previous builds add up.
            sudo docker image prune -af --filter "until=336h" >/dev/null 2>&1 || true

            echo "deployed $NEW"
