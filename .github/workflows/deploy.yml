name: Deploy landing

# The image is built here, on GitHub's runner, and shipped to the server as a finished artefact.
# The box has 1.8GB of RAM and already runs the application stack, so building there would compete
# with live traffic. Building here also means a broken commit never reaches production: if the build
# step fails the job stops and the running container is never touched.
#
# The image is streamed over SSH rather than pushed to a registry because organisation policy blocks
# public packages, and a private one would mean parking a long-lived registry token on the server.
# Streaming needs no new credential and nothing expires.

on:
  push:
    branches: [main]
  workflow_dispatch:

# Two deploys racing would leave whichever finished last in place, not necessarily the newer commit.
concurrency:
  group: deploy-landing
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          # NEXT_PUBLIC_* values are inlined at build time, so the public URL must be known here.
          build-args: NEXT_PUBLIC_SITE_URL=https://www.meetbrains.ai
          # Tagged by commit so every deploy stays addressable on the box for rollback.
          tags: meetbrains-landing:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Open an SSH channel to the server
        env:
          KEY: ${{ secrets.EC2_SSH_KEY }}
          HOST: ${{ secrets.EC2_HOST }}
        run: |
          mkdir -p ~/.ssh
          # A key pasted from a Windows clipboard carries carriage returns, which OpenSSH rejects
          # with the unhelpful "string is too large". Strip them rather than depend on how the
          # secret was copied.
          printf '%s\n' "$KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Fail here, with a clear reason, rather than 200MB into an image transfer.
          if ! ssh-keygen -y -f ~/.ssh/deploy_key > /dev/null 2>&1; then
            echo "::error::EC2_SSH_KEY is not a valid OpenSSH private key. Re-copy the whole file, including the BEGIN and END lines."
            exit 1
          fi
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Ship the image
        env:
          HOST: ${{ secrets.EC2_HOST }}
          USER_NAME: ${{ secrets.EC2_USER }}
        run: |
          # Streamed, so neither side ever writes a multi-hundred-megabyte tarball to disk.
          docker save meetbrains-landing:${{ github.sha }} \
            | gzip -1 \
            | ssh -i ~/.ssh/deploy_key -o BatchMode=yes "$USER_NAME@$HOST" 'gunzip | sudo docker load'

      - name: Swap the container, with rollback
        env:
          HOST: ${{ secrets.EC2_HOST }}
          USER_NAME: ${{ secrets.EC2_USER }}
        run: |
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes "$USER_NAME@$HOST" bash -s <<'REMOTE'
          set -e
          NEW="meetbrains-landing:${{ github.sha }}"

          # Remember what is serving now, so a bad release can be undone inside this same run.
          PREV=$(sudo docker inspect --format '{{.Config.Image}}' meetbrains-landing 2>/dev/null || echo "")
          echo "current: ${PREV:-none}"
          echo "new:     $NEW"

          start() {
            sudo docker rm -f meetbrains-landing >/dev/null 2>&1 || true
            sudo docker run -d --name meetbrains-landing --restart unless-stopped \
              -p 127.0.0.1:3000:3000 \
              -e MEETBRAINS_API_URL=https://app.meetbrains.ai \
              "$1" >/dev/null
          }

          start "$NEW"

          # The image declares a HEALTHCHECK, so wait on Docker's verdict rather than guessing
          # with a fixed sleep.
          STATUS=starting
          for _ in $(seq 1 40); do
            STATUS=$(sudo docker inspect --format '{{.State.Health.Status}}' meetbrains-landing 2>/dev/null || echo starting)
            [ "$STATUS" = "healthy" ] && break
            [ "$STATUS" = "unhealthy" ] && break
            sleep 3
          done

          if [ "$STATUS" != "healthy" ]; then
            echo "new image did not become healthy (status: $STATUS)"
            sudo docker logs --tail 50 meetbrains-landing || true
            if [ -n "$PREV" ]; then
              echo "rolling back to $PREV"
              start "$PREV"
            fi
            exit 1
          fi

          # Prove it through nginx, not just inside the container.
          curl -fsS -o /dev/null --retry 3 --retry-delay 2 https://www.meetbrains.ai/

          # Small disk: drop images older than two weeks, which still leaves recent ones for rollback.
          sudo docker image prune -af --filter "until=336h" >/dev/null 2>&1 || true

          echo "deployed $NEW"
          REMOTE

      - name: Discard the key
        if: always()
        run: rm -f ~/.ssh/deploy_key
